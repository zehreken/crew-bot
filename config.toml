# Non-secret settings. Safe to commit and share with other coaches.
# Secrets (Spond login, Google key path) live in .env - see .env.example.

[spond]
# The Spond group to pull from, as it is named in the app.
# Run `python -m crew_bot groups` to list the groups your login can see.
group_name = "Hammarby Rodd"

# Only events whose title contains one of these is pulled. An event matches if
# ANY entry matches. Matching is case-insensitive and ignores extra whitespace.
#
# Deliberately an explicit list rather than a loose "rowing" match: that would
# also pull in anything else with "rowing" in the title. Add a line here when a
# new open session starts running.
event_title_matches = [
    "monday rowing",
    "thursday rowing",
    "saturday rowing",
]

# How many days ahead to look for sessions.
lookahead_days = 14

# Safety cap on how many events to request from Spond in one go.
max_events = 100

[sheets]
# The Google Sheet to write to, by its exact name.
# It must be shared with the service account email - see README.md.
spreadsheet_name = "crew-bot"

# The tab within that sheet. Created automatically if it does not exist.
worksheet_name = "Attendance"

# The tab holding the boat inventory: type, weight, name, producer, class,
# available, notes. Created with example rows if it does not exist.
boats_worksheet_name = "Boats"

# The tab holding the rower roster: name, level. This is the club's own small
# database - Spond has no field for a rower's level, so it lives here.
# Run `python -m crew_bot rowers` to create it and keep it up to date.
rowers_worksheet_name = "Rowers"

# The tab listing each Spond subgroup with its members underneath. Unlike Boats
# and Rowers this one is an output: `python -m crew_bot groups-tab` rebuilds it
# from Spond wholesale, so nothing typed into it survives. It is created next to
# the Rowers tab, which is the roster it breaks down.
groups_worksheet_name = "Groups"

[export]
# Where `crew_bot export` writes the JSON the C++ crew app reads.
path = "data/attendance.json"
