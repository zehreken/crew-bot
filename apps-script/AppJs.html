<script>
/**
 * The Assignment pane: turning pointer events into calls on CrewsJs.
 *
 * There is no logic about rowing in here. Every edit is one call into the
 * ported crews.h, and the page re-renders from the result - so what the coach
 * sees is always the assignment itself rather than a copy of it that could
 * drift.
 */

var APP = {
  payload: null, // what uiLoadPayload returned
  sessionIndex: -1,
  assignment: null, // {crews, unassigned}
  saving: false,

  tab: 'assignment',
  groupFilter: '',

  // The Attendance pane loads separately - see loadAttendance. Null means it
  // has not been asked for yet, which is not the same as it having come back
  // empty, and the pane says something different for each.
  attendance: null,
  attendanceFilter: '',
  attendanceLoading: false,
};

// The drag in progress, or null. `moved` guards against a click being read as
// a drag: nothing happens until the pointer has actually travelled.
var DRAG = null;
var DRAG_THRESHOLD = 4;

// The frame loop that scrolls the page while a drag sits against its edge, or
// null when no drag is running. See startEdgeScroll_.
var DRAG_SCROLL = null;
var DRAG_EDGE = 72; // px from the top or bottom of the window that scrolls

function el(id) {
  return document.getElementById(id);
}

function setStatus(text, isError) {
  var node = el('status');
  node.textContent = text || '';
  node.className = isError ? 'status error' : 'status';
}

function session_() {
  if (!APP.payload || APP.sessionIndex < 0) {
    return null;
  }
  return APP.payload.sessions[APP.sessionIndex];
}

// ---------------------------------------------------------------- loading --

function load() {
  setStatus('Pulling from Spond...');
  el('reload').disabled = true;
  google.script.run
    .withSuccessHandler(onLoaded)
    .withFailureHandler(function (err) {
      el('reload').disabled = false;
      setStatus(err.message || String(err), true);
    })
    .uiLoadPayload();
}

function onLoaded(payload) {
  APP.payload = payload;
  el('reload').disabled = false;

  var picker = el('session');
  picker.innerHTML = '';
  payload.sessions.forEach(function (s, i) {
    var option = document.createElement('option');
    option.value = String(i);
    option.textContent = s.date + '  ' + s.heading + '  (' + s.counts.accepted + ' accepted)';
    picker.appendChild(option);
  });

  if (!payload.sessions.length) {
    setStatus(
      'No upcoming sessions matched. Check eventTitleMatches in Config.gs, or ' +
      'run listEventTitles to see what the events are called.',
      true
    );
    APP.sessionIndex = -1;
    render();
    return;
  }

  selectSession(0);
  setStatus(
    payload.boats.length + ' boats available, ' + payload.rowers.length + ' rowers in the club.'
  );
}

/** Everyone who accepted, in the pool, no boats out yet. */
function selectSession(index) {
  APP.sessionIndex = index;
  var s = session_();
  APP.assignment = { crews: [], unassigned: s ? s.accepted.slice() : [], land: [] };
  render();
}

// ------------------------------------------------------------- the buttons --

function doAssign() {
  var s = session_();
  if (!s) {
    return;
  }
  // Land survives a re-assign: the coach put those people there on purpose.
  APP.assignment = assign_(s, APP.payload.boats, land_(APP.assignment));
  var seated = 0;
  APP.assignment.crews.forEach(function (crew) {
    seated += filled_(crew);
  });
  setStatus(
    APP.assignment.crews.length + ' boats out, ' + seated + ' seated, ' +
    APP.assignment.land.length + ' on land, ' +
    APP.assignment.unassigned.length + ' in the pool.'
  );
  render();
}

function doAddBoat() {
  var at = firstFreeBoat_(APP.assignment, APP.payload.boats);
  if (at < 0) {
    setStatus('Every boat in the inventory is already out.', true);
    return;
  }
  var boat = APP.payload.boats[at];
  addCrew_(APP.assignment, boat);
  setStatus(boatLabel_(boat) + ' is on the water, all seats empty.');
  render();
}

function doRemove(crewIndex) {
  var name = APP.assignment.crews[crewIndex].boat.name;
  var freed = removeCrew_(APP.assignment, crewIndex);
  setStatus(
    name + ' is off the water' +
    (freed > 0 ? ', its ' + freed + ' rowers back in the pool.' : '.')
  );
  render();
}

function doFill(crewIndex) {
  var crew = APP.assignment.crews[crewIndex];
  var seated = fillCrew_(APP.assignment, crewIndex);
  var empty = crew.seats.length - filled_(crew);

  var message = seated === 0 ? 'Nobody was seated.' : 'Seated ' + seated + ' in ' + crew.boat.name + '.';
  if (empty > 0) {
    message += ' ' + empty + ' seat' + (empty === 1 ? '' : 's') + ' still empty';
    // Distinguish "the pool ran out" from "the pool has people this hull is
    // too much for" - they need different things done about them.
    message += APP.assignment.unassigned.length
      ? ' - nobody left in the pool is ' + (crew.boat['class'] || 'eligible') + ' or better.'
      : ' - the pool is empty.';
  }
  setStatus(message);
  render();
}

function doClear(crewIndex) {
  var crew = APP.assignment.crews[crewIndex];
  var freed = clearCrew_(APP.assignment, crewIndex);
  setStatus(
    crew.boat.name + ' is empty' + (freed > 0 ? ', its ' + freed + ' rowers back in the pool.' : '.')
  );
  render();
}

function doSetBoat(crewIndex, boatName) {
  var boat = null;
  APP.payload.boats.forEach(function (b) {
    if (b.name === boatName) {
      boat = b;
    }
  });
  if (!boat) {
    return;
  }

  var displaced = setBoat_(APP.assignment, crewIndex, boat);
  if (displaced < 0) {
    setStatus(boat.name + ' is already out with another crew.', true);
    render();
    return;
  }
  setStatus(
    'Now rowing ' + boatLabel_(boat) +
    (displaced > 0
      ? '. ' + displaced + ' rower' + (displaced === 1 ? '' : 's') +
        ' did not fit and went back to the pool.'
      : '.')
  );
  render();
}

// ------------------------------------------------------------------ saving --

function doSave() {
  var s = session_();
  if (!s || APP.saving) {
    return;
  }

  var result = {
    generated_at: APP.payload.generated_at,
    session: { id: s.id, date: s.date, heading: s.heading, start: s.start },
    crews: APP.assignment.crews.map(function (crew) {
      return {
        boat: crew.boat.name,
        type: crew.boat.type,
        'class': crew.boat['class'],
        seats: crew.boat.seats,
        // Occupied seats in seat order. A boat with a gap shows up on the tab
        // as "Kaza (3/4 seats)" - the count comes from the boat, so a short
        // crew is visible rather than silently renumbered.
        rowers: crew.seats
          .filter(function (seat) {
            return !!seat;
          })
          .map(function (seat) {
            return { id: seat.id, name: seat.name, level: seat.level };
          }),
      };
    }),
    land: land_(APP.assignment).map(function (rower) {
      return { id: rower.id, name: rower.name };
    }),
    unassigned: APP.assignment.unassigned.map(function (rower) {
      return { id: rower.id, name: rower.name };
    }),
  };

  APP.saving = true;
  el('save').disabled = true;
  setStatus('Saving to the "' + s.date + '" tab...');
  google.script.run
    .withSuccessHandler(function (message) {
      APP.saving = false;
      el('save').disabled = false;
      setStatus(message);
    })
    .withFailureHandler(function (err) {
      APP.saving = false;
      el('save').disabled = false;
      setStatus(err.message || String(err), true);
    })
    .uiSaveCrews(result);
}

// ----------------------------------------------------------- the message --

/**
 * The crews as plain text, for pasting into Spond.
 *
 * The only thing this app produces that the rowers themselves read, so it says
 * just what a rower needs: which boat, which seat, and whether they are in one
 * at all. No levels and no boat classes - those are the coach's working notes,
 * and "no boat" beside somebody's name is not a thing to broadcast.
 *
 * Shaped like crewsToRows_ in Ui.gs deliberately. The message and the sheet
 * tab are the same list, and a rower who sees both should see one answer.
 */
function messageText_() {
  var s = session_();
  if (!s || !APP.assignment) {
    return '';
  }
  var land = land_(APP.assignment);
  if (!APP.assignment.crews.length && !land.length) {
    return '';
  }

  var lines = [s.heading + '  ' + s.date, ''];

  APP.assignment.crews.forEach(function (crew) {
    var rowers = crew.seats.filter(function (seat) {
      return !!seat;
    });
    var head = crew.boat.name + (crew.boat.type ? '  ' + crew.boat.type : '');
    // Only when it is short. A full crew needs no arithmetic, and a gap is
    // exactly what a coach wants to notice in the moment before sending.
    if (rowers.length < crew.seats.length) {
      head += '  (' + rowers.length + ' of ' + crew.seats.length + ' seats)';
    }
    lines.push(head);
    rowers.forEach(function (rower, i) {
      lines.push(i + 1 + '. ' + rower.name);
    });
    lines.push('');
  });

  // After the boats, as one more block: Land is where somebody is training,
  // the same kind of answer as a boat. Unnumbered - there are no seats.
  if (land.length) {
    lines.push('Land');
    land.forEach(function (rower) {
      lines.push(rower.name);
    });
    lines.push('');
  }

  if (APP.assignment.unassigned.length) {
    // Named, not left out. Somebody who accepted and is not going out should
    // hear it from the coach rather than work it out from an absence.
    lines.push(
      'Not in a boat: ' +
        APP.assignment.unassigned
          .map(function (rower) {
            return rower.name;
          })
          .join(', ')
    );
  }

  return lines.join('\n').replace(/\n+$/, '') + '\n';
}

function renderMessage() {
  var box = el('message');
  box.value = messageText_();
  el('copy-message').disabled = !box.value;
}

/**
 * Put the message on the clipboard.
 *
 * execCommand rather than navigator.clipboard: the page is served inside
 * Google's sandboxed iframe, where the async clipboard API is blocked by
 * permissions policy often enough not to be worth relying on. Either way the
 * text is left selected, so Ctrl+C still works when this does not.
 */
function doCopyMessage() {
  var box = el('message');
  if (!box.value) {
    return;
  }
  box.focus();
  box.select();

  var copied = false;
  try {
    copied = document.execCommand('copy');
  } catch (err) {
    copied = false;
  }

  setStatus(
    copied
      ? 'Message copied. Paste it into Spond.'
      : 'Could not reach the clipboard - the message is selected, press Ctrl+C.',
    !copied
  );
}

// --------------------------------------------------------------- rendering --

function render() {
  renderCrews();
  renderPool();
  renderGroups();
  renderAttendance();
  renderMessage();
  el('assign').disabled = !session_();
  el('save').disabled = !session_() || APP.saving;
  el('save-groups').disabled = !groups_().length || APP.saving;
  el('load-attendance').disabled = APP.attendanceLoading;
  el('save-attendance').disabled =
    !APP.attendance || !APP.attendance.entries.length || APP.saving;
}

var PANES = ['assignment', 'groups', 'attendance'];

function showTab(name) {
  APP.tab = name;
  PANES.forEach(function (pane) {
    el('pane-' + pane).className = pane === name ? '' : 'hidden';
    el('tab-' + pane).className = pane === name ? 'tab active' : 'tab';
  });
}

function renderCrews() {
  var host = el('crews');
  host.innerHTML = '';

  if (!APP.assignment) {
    return;
  }

  APP.assignment.crews.forEach(function (crew, crewIndex) {
    var box = document.createElement('div');
    box.className = 'crew';

    var head = document.createElement('div');
    head.className = 'crew-head';

    // Every hull not already out with another crew, plus this crew's own.
    var picker = document.createElement('select');
    APP.payload.boats.forEach(function (boat) {
      if (boat.name !== crew.boat.name && boatInUse_(APP.assignment, boat.name, crewIndex)) {
        return;
      }
      var option = document.createElement('option');
      option.value = boat.name;
      option.textContent = boatLabel_(boat);
      option.selected = boat.name === crew.boat.name;
      picker.appendChild(option);
    });
    picker.onchange = function () {
      doSetBoat(crewIndex, picker.value);
    };
    head.appendChild(picker);

    head.appendChild(button_('-', 'Take this boat off the water', function () {
      doRemove(crewIndex);
    }));
    head.appendChild(button_('assign', 'Fill this boat from the pool', function () {
      doFill(crewIndex);
    }));
    head.appendChild(button_('clear', 'Empty this boat, keeping it out', function () {
      doClear(crewIndex);
    }));

    var under = underClassed_(crew);
    var note = document.createElement('div');
    note.className = under ? 'crew-note bad' : 'crew-note';
    note.textContent =
      filled_(crew) + '/' + crew.seats.length + ' seats' +
      (under ? '   ' + under + ' below class ' + crew.boat['class'] : '');
    head.appendChild(note);
    box.appendChild(head);

    // Every seat, numbered bow to stern, whether or not anyone is in it.
    crew.seats.forEach(function (rower, seatIndex) {
      box.appendChild(seatRow_(crew, crewIndex, rower, seatIndex));
    });

    host.appendChild(box);
  });

  // The + is the only button in this pane before Assign crews, so a coach can
  // build the whole session by hand if they would rather.
  var add = button_('+ boat', 'Put the next free boat on the water', doAddBoat);
  add.id = 'add';
  host.appendChild(add);

  host.appendChild(landBox_());
}

/**
 * Land: the erg room, drawn as one more boat with no seat limit.
 *
 * Always there, empty or not, because it is a drop target - a box that only
 * appears once somebody is in it is a box nobody can put the first person in.
 * The whole box takes the drop, like the pool panel, so there is no seat to
 * aim at. No level warnings: there is no hull to be below.
 */
function landBox_() {
  var land = land_(APP.assignment);

  var box = document.createElement('div');
  box.className = 'crew land';
  box.dataset.dropKind = 'land';

  var head = document.createElement('div');
  head.className = 'group-head';
  var title = document.createElement('span');
  title.textContent = 'Land';
  head.appendChild(title);
  var count = document.createElement('span');
  count.className = 'level';
  count.textContent = land.length + ' on the erg';
  head.appendChild(count);
  box.appendChild(head);

  if (!land.length) {
    var note = document.createElement('div');
    note.className = 'empty-note';
    note.textContent = 'Drop anyone training on land here.';
    box.appendChild(note);
  }

  land.forEach(function (rower, landIndex) {
    var row = document.createElement('div');
    row.className = 'pool-item';
    row.dataset.dragKind = 'land';
    row.dataset.land = String(landIndex);

    var name = document.createElement('span');
    name.className = 'nm';
    name.textContent = rower.name;
    row.appendChild(name);

    var level = document.createElement('span');
    level.className = 'level';
    level.textContent = levelLabel_(rower.level);
    row.appendChild(level);

    row.appendChild(grip_());
    box.appendChild(row);
  });

  return box;
}

function seatRow_(crew, crewIndex, rower, seatIndex) {
  var row = document.createElement('div');
  row.dataset.dropKind = 'seat';
  row.dataset.crew = String(crewIndex);
  row.dataset.seat = String(seatIndex);

  var number = document.createElement('span');
  number.className = 'num';
  number.textContent = seatIndex + 1 + '.';
  row.appendChild(number);

  if (!rower) {
    row.className = 'seat empty';
    var dash = document.createElement('span');
    dash.textContent = '--';
    row.appendChild(dash);
    return row;
  }

  var below = !mayRow_(rower, crew.boat);
  row.className = below ? 'seat filled under' : 'seat filled';
  row.dataset.dragKind = 'seat';

  // Classed rather than found by position: the drag reads the label off this
  // span, and the row has three spans in it that all look alike to a selector.
  var name = document.createElement('span');
  name.className = 'nm';
  name.textContent = rower.name;
  row.appendChild(name);

  var level = document.createElement('span');
  level.className = 'level';
  // "no boat" already says everything; adding "below class" to it would be
  // two ways of saying the same seat is wrong.
  level.textContent =
    levelLabel_(rower.level) + (below && rower.level ? '   below class' : '');
  row.appendChild(level);

  row.appendChild(grip_());

  return row;
}

function renderPool() {
  var host = el('pool');
  host.innerHTML = '';
  if (!APP.assignment) {
    return;
  }

  if (!APP.assignment.unassigned.length) {
    var note = document.createElement('div');
    note.className = 'empty-note';
    note.textContent = 'Nobody in the pool.';
    host.appendChild(note);
    return;
  }

  APP.assignment.unassigned.forEach(function (rower, poolIndex) {
    var row = document.createElement('div');
    row.className = 'pool-item';
    row.dataset.dragKind = 'pool';
    row.dataset.pool = String(poolIndex);

    var name = document.createElement('span');
    name.className = 'nm';
    name.textContent = rower.name;
    row.appendChild(name);

    var level = document.createElement('span');
    level.className = 'level';
    level.textContent = levelLabel_(rower.level);
    row.appendChild(level);

    row.appendChild(grip_());

    host.appendChild(row);
  });
}

/**
 * The handle a finger drags a rower by.
 *
 * It exists because of one CSS property. A touch that starts on ordinary
 * content belongs to the browser, which pans the page with it and sends the
 * page a pointercancel - so on a phone every drag died a few pixels in.
 * `touch-action: none` takes the gesture back, but on the whole row it would
 * take scrolling with it, and the pool on a phone is mostly rows: there would
 * be nothing left to pull the list up by. So the exemption is this one small
 * span, and the two gestures stop competing - grip to drag, anywhere else to
 * scroll.
 *
 * A mouse ignores all of this and still drags the whole row; see
 * onPointerDown. The grip is drawn for both because a control that appears
 * only on touch is a control nobody discovers.
 *
 * aria-hidden because it is a texture, not a word: a screen reader reading
 * "braille pattern dots" after every name would be worse than silence.
 */
function grip_() {
  var grip = document.createElement('span');
  grip.className = 'grip';
  // As an escape, not the character: this file gets pasted into the Apps
  // Script editor by hand often enough that ASCII source is worth it.
  grip.textContent = '\u283f';
  grip.setAttribute('aria-hidden', 'true');
  grip.title = 'Drag to move';
  return grip;
}

function button_(text, title, onClick) {
  var b = document.createElement('button');
  b.textContent = text;
  b.title = title;
  b.onclick = onClick;
  return b;
}

// ------------------------------------------------------------------ groups --

function groups_() {
  return (APP.payload && APP.payload.groups) || [];
}

function ungrouped_() {
  return (APP.payload && APP.payload.ungrouped) || [];
}

/** "6 members", or "2 of 6" while a filter is hiding some of them. */
function memberLabel_(shown, total, filtered) {
  if (filtered) {
    return shown + ' of ' + total;
  }
  return total + ' member' + (total === 1 ? '' : 's');
}

/**
 * The club's groups, each with its members under it - the pane form of the
 * Groups tab, and the same order: groups by name, then anyone in none.
 *
 * Read-only, and since the Rowers pane went it is also the only list of the
 * whole club in the page. Spond owns which group a rower is in and there is no
 * API here for changing that, so a wrong group is fixed in the Spond app and
 * picked up by the next Reload. The one thing this pane writes is the tab.
 *
 * Levels are looked up off the roster by id at draw time rather than carried
 * on each member, so the payload's group members stay a name and an id. They
 * are shown, never set - and what they show is this pane's own content read
 * back, because a level IS the best group a rower is in. Everyone in the
 * Grupp 4 block reads AA, everyone in Grupp 0 reads "no boat", and the three
 * leaders read AA in every block they appear in.
 */
function renderGroups() {
  var host = el('groups');
  host.innerHTML = '';
  if (!APP.payload) {
    return;
  }

  var levels = {};
  APP.payload.rowers.forEach(function (rower) {
    levels[rower.id] = rower.level;
  });

  var needle = APP.groupFilter.trim().toLowerCase();
  var blocks = groups_().slice();
  var unplaced = ungrouped_();
  if (unplaced.length) {
    // Last, and named rather than implied: a member in no group is the one
    // thing here that is a to-do rather than a fact. Same as the sheet tab.
    blocks.push({ name: 'Not in any group', members: unplaced });
  }

  var shown = 0;
  blocks.forEach(function (block) {
    var members = block.members.filter(function (member) {
      return !needle || member.name.toLowerCase().indexOf(needle) !== -1;
    });
    // A filter hides a group it empties, rather than leaving a row of headings
    // behind. Unfiltered, an empty group stays: it means someone made it in
    // Spond and has not filled it in, which is worth seeing.
    if (needle && !members.length) {
      return;
    }
    shown += members.length;

    var wrap = document.createElement('div');
    wrap.className = 'group';

    var head = document.createElement('div');
    head.className = 'group-head';
    var title = document.createElement('span');
    title.textContent = block.name;
    head.appendChild(title);
    var count = document.createElement('span');
    count.className = 'level';
    count.textContent = memberLabel_(members.length, block.members.length, !!needle);
    head.appendChild(count);
    wrap.appendChild(head);

    members.forEach(function (member) {
      // A row rather than a button: with the Rowers pane gone there is nowhere
      // for a click to go, and something that looks pressable but is not is
      // worse than a plain line.
      var item = document.createElement('div');
      item.className = 'group-item';

      var name = document.createElement('span');
      name.textContent = member.name;
      item.appendChild(name);

      var level = document.createElement('span');
      level.className = 'level';
      level.textContent = levelLabel_(levels[member.id]);
      item.appendChild(level);

      wrap.appendChild(item);
    });

    host.appendChild(wrap);
  });

  if (!blocks.length || (needle && !shown)) {
    var note = document.createElement('div');
    note.className = 'empty-note';
    note.textContent = blocks.length
      ? 'Nobody matches "' + APP.groupFilter + '".'
      : 'No groups loaded. Press "Reload from Spond".';
    host.appendChild(note);
  }
}

/**
 * Write the Groups tab from what is on screen.
 *
 * What is on screen, not a fresh pull: the same rule the crews save follows.
 * Reload from Spond is how you get newer data, and it is one button up.
 */
function doSaveGroups() {
  if (APP.saving || !groups_().length) {
    return;
  }

  APP.saving = true;
  el('save-groups').disabled = true;
  setStatus('Writing the Groups tab...');
  google.script.run
    .withSuccessHandler(function (message) {
      APP.saving = false;
      setStatus(message);
      render();
    })
    .withFailureHandler(function (err) {
      APP.saving = false;
      setStatus(err.message || String(err), true);
      render();
    })
    .uiSaveGroups(groups_(), ungrouped_());
}

// -------------------------------------------------------------- attendance --

/**
 * Fetch the year. Separate from load(), and slow on purpose.
 *
 * uiLoadAttendance is a login, the year in chunks, and a profile lookup for
 * everyone who rowed and has since left - tens of seconds, where the ordinary
 * page load is one request. It is not folded into load() because a coach
 * opening this at the boathouse is there to put people in boats, and would be
 * paying that wait on every visit for a number they ask for a few times a
 * season. The button says so, and the pane says so while it waits: an Apps
 * Script call reports no progress, and half a minute of silence reads as a
 * hang rather than as work.
 */
function loadAttendance() {
  if (APP.attendanceLoading) {
    return;
  }

  APP.attendanceLoading = true;
  setStatus('Reading a year of sessions out of Spond. This takes a while...');
  render();

  google.script.run
    .withSuccessHandler(function (report) {
      APP.attendanceLoading = false;
      APP.attendance = report;
      setStatus(
        report.entries.length + ' rowers over ' + report.sessionCount +
        (report.sessionCount === 1 ? ' session.' : ' sessions.')
      );
      render();
    })
    .withFailureHandler(function (err) {
      APP.attendanceLoading = false;
      setStatus(err.message || String(err), true);
      render();
    })
    .uiLoadAttendance();
}

/**
 * Draw the counts as two blocks: above the line and below it.
 *
 * Two blocks rather than one list with a divider row. The sheet draws a
 * divider because a sheet is a grid and that is all it can do; the pane
 * already has a vocabulary for "a heading with people under it" from the
 * Groups pane, and the split IS the question - the cleaning crews come out of
 * the first block. An empty block is kept for the same reason an empty group
 * is: "nobody is over the line" is an answer, and a missing heading is not.
 */
function renderAttendance() {
  var host = el('attendance');
  host.innerHTML = '';

  var report = APP.attendance;
  if (!report) {
    var waiting = document.createElement('div');
    waiting.className = 'empty-note';
    // Null means not asked for yet; loading means asked for and still going.
    // Saying the same thing for both would look like the button did nothing.
    waiting.textContent = APP.attendanceLoading
      ? 'Reading a year out of Spond. This takes a while.'
      : 'Press "Load from Spond". It reads the last twelve months, so it ' +
        'takes longer than the rest of the page.';
    host.appendChild(waiting);
    return;
  }

  var summary = document.createElement('div');
  summary.className = 'empty-note';
  summary.textContent =
    report.window + ': ' + report.sessionCount +
    (report.sessionCount === 1 ? ' session.' : ' sessions.');
  host.appendChild(summary);

  var needle = APP.attendanceFilter.trim().toLowerCase();
  var over = [];
  var under = [];
  report.entries.forEach(function (entry) {
    if (needle && entry.name.toLowerCase().indexOf(needle) === -1) {
      return;
    }
    (entry.attended > report.threshold ? over : under).push(entry);
  });

  if (!over.length && !under.length) {
    var empty = document.createElement('div');
    empty.className = 'empty-note';
    empty.textContent = needle
      ? 'Nobody matches "' + APP.attendanceFilter + '".'
      : 'No sessions matched. Check eventTitleMatches in Config.gs.';
    host.appendChild(empty);
    return;
  }

  [
    { name: 'More than ' + report.threshold + ' sessions', rows: over },
    { name: report.threshold + ' sessions or fewer', rows: under },
  ].forEach(function (block) {
    var wrap = document.createElement('div');
    wrap.className = 'group';

    var head = document.createElement('div');
    head.className = 'group-head';
    var title = document.createElement('span');
    title.textContent = block.name;
    head.appendChild(title);
    var count = document.createElement('span');
    count.className = 'level';
    count.textContent =
      block.rows.length + (block.rows.length === 1 ? ' rower' : ' rowers');
    head.appendChild(count);
    wrap.appendChild(head);

    block.rows.forEach(function (entry) {
      var item = document.createElement('div');
      item.className = 'group-item';

      var name = document.createElement('span');
      // Marked in the name because the row has two columns and the count owns
      // the other. Somebody who has left the club should not end up on a
      // cleaning crew however many sessions they rowed before going.
      name.textContent = entry.former
        ? entry.name + ' - left the club'
        : entry.name;
      item.appendChild(name);

      var tally = document.createElement('span');
      tally.className = 'level';
      // Attended of invited, so a low count that is really a late arrival
      // reads as one. The sheet has a column for it; here it is one cell.
      tally.textContent = entry.attended + ' of ' + entry.invited;
      item.appendChild(tally);

      wrap.appendChild(item);
    });

    host.appendChild(wrap);
  });
}

/**
 * Write the Attendance tab from what the pane is showing.
 *
 * The report the page is holding goes straight back, unchanged - so the sheet
 * says what the coach was looking at, and nobody waits through a second
 * year-long fetch to write it down. Same rule as the crews and groups saves.
 */
function doSaveAttendance() {
  if (APP.saving || !APP.attendance || !APP.attendance.entries.length) {
    return;
  }

  APP.saving = true;
  el('save-attendance').disabled = true;
  setStatus('Writing the Attendance tab...');
  google.script.run
    .withSuccessHandler(function (message) {
      APP.saving = false;
      setStatus(message);
      render();
    })
    .withFailureHandler(function (err) {
      APP.saving = false;
      setStatus(err.message || String(err), true);
      render();
    })
    .uiSaveAttendance(APP.attendance);
}

// ---------------------------------------------------------------- dragging --

function onPointerDown(event) {
  if (event.button !== 0) {
    return;
  }
  var source = event.target.closest('[data-drag-kind]');
  if (!source) {
    return;
  }

  // A mouse takes hold of the row anywhere on it. A finger or a pen may take
  // hold only of the grip, because the rest of the row has to stay the thing
  // that scrolls the list - see grip_ and `touch-action` in Styles.html for
  // why the two cannot be the same surface.
  var byTouch = event.pointerType === 'touch' || event.pointerType === 'pen';
  if (byTouch && !event.target.closest('.grip')) {
    return;
  }

  var label = source.querySelector('.nm');
  DRAG = {
    kind: source.dataset.dragKind,
    crew: source.dataset.crew === undefined ? -1 : parseInt(source.dataset.crew, 10),
    seat: source.dataset.seat === undefined ? -1 : parseInt(source.dataset.seat, 10),
    pool: source.dataset.pool === undefined ? -1 : parseInt(source.dataset.pool, 10),
    land: source.dataset.land === undefined ? -1 : parseInt(source.dataset.land, 10),
    label: label ? label.textContent : '',
    touch: byTouch,
    startX: event.clientX,
    startY: event.clientY,
    // Kept up to date on every move, because the drop reads them and so does
    // the scroll loop, which runs on frames rather than on pointer events.
    x: event.clientX,
    y: event.clientY,
    moved: false,
  };
  // So the drag survives the pointer leaving the element it started on.
  source.setPointerCapture(event.pointerId);
  event.preventDefault();
}

function onPointerMove(event) {
  if (!DRAG) {
    return;
  }
  DRAG.x = event.clientX;
  DRAG.y = event.clientY;

  if (!DRAG.moved) {
    var far =
      Math.abs(DRAG.x - DRAG.startX) > DRAG_THRESHOLD ||
      Math.abs(DRAG.y - DRAG.startY) > DRAG_THRESHOLD;
    if (!far) {
      return;
    }
    DRAG.moved = true;
    var ghost = el('ghost');
    ghost.textContent = DRAG.label;
    ghost.classList.remove('hidden');
    startEdgeScroll_();
  }

  placeGhost_();
  highlight_(dropTargetAt_(DRAG.x, DRAG.y));
}

/**
 * Put the ghost where the coach can actually see it.
 *
 * Under a mouse it trails below and right of the cursor, out of the way of
 * what is being aimed at. Under a finger that same offset puts it under the
 * hand, so on touch it sits above the touch point and centred on it - the
 * fingertip is the drop point, and the name has to clear the finger to be
 * read at all.
 */
function placeGhost_() {
  var ghost = el('ghost');
  var x = DRAG.touch ? DRAG.x - ghost.offsetWidth / 2 : DRAG.x + 12;
  var y = DRAG.touch ? DRAG.y - ghost.offsetHeight - 24 : DRAG.y + 12;

  // Held on screen, so a name dragged to the very top or to either edge is
  // still a readable label rather than half of one.
  x = Math.max(4, Math.min(x, window.innerWidth - ghost.offsetWidth - 4));
  y = Math.max(4, y);

  ghost.style.left = Math.round(x) + 'px';
  ghost.style.top = Math.round(y) + 'px';
}

/**
 * Scroll the page while a drag is held against the top or bottom of it.
 *
 * On a phone the crews and the pool are stacked rather than side by side, so
 * the two ends of a drag are routinely not on screen together - and the hand
 * that would scroll to find the other end is the hand holding the rower. So
 * the drag scrolls: within DRAG_EDGE of an edge the page moves, faster the
 * nearer the edge, which also gives a coach a way to slow it down.
 *
 * It runs on its own frame loop rather than out of onPointerMove because a
 * finger parked at the bottom of the screen waiting for the page to come to it
 * sends no move events at all - it is not moving. The loop re-reads the drop
 * target each frame for the same reason: the page slid underneath, so what is
 * under the finger changed without the finger.
 */
function startEdgeScroll_() {
  if (DRAG_SCROLL !== null) {
    return;
  }

  var step = function () {
    if (!DRAG || !DRAG.moved) {
      DRAG_SCROLL = null;
      return;
    }
    var speed = edgeSpeed_(DRAG.y);
    if (speed) {
      window.scrollBy(0, speed);
      placeGhost_();
      highlight_(dropTargetAt_(DRAG.x, DRAG.y));
    }
    DRAG_SCROLL = window.requestAnimationFrame(step);
  };

  DRAG_SCROLL = window.requestAnimationFrame(step);
}

function stopEdgeScroll_() {
  if (DRAG_SCROLL !== null) {
    window.cancelAnimationFrame(DRAG_SCROLL);
    DRAG_SCROLL = null;
  }
}

/** Pixels to scroll this frame for a drag at y, negative for up, 0 for none. */
function edgeSpeed_(y) {
  if (y < DRAG_EDGE) {
    return -Math.ceil((DRAG_EDGE - y) / 5);
  }
  var bottom = window.innerHeight - DRAG_EDGE;
  if (y > bottom) {
    return Math.ceil((y - bottom) / 5);
  }
  return 0;
}

function onPointerUp(event) {
  if (!DRAG) {
    return;
  }
  var drag = DRAG;
  drag.x = event.clientX;
  drag.y = event.clientY;
  endDrag_();

  if (!drag.moved) {
    return; // a click, not a drag
  }

  var target = dropTargetAt_(drag.x, drag.y);
  if (!target) {
    return; // dropped nowhere
  }
  applyDrop_(drag, target);
}

/**
 * A cancelled drag is not a drop.
 *
 * The browser sends pointercancel when it takes the gesture back - the phone
 * turns, a second finger lands, a system edge-swipe starts. It carries
 * coordinates like every other pointer event, and this used to run the same
 * handler as pointerup, which read those coordinates and seated somebody there
 * as though the coach had let go on purpose. A drop nobody made is the one
 * mistake this pane must not make, so a cancel puts the rower back and draws
 * nothing.
 */
function onPointerCancel() {
  if (!DRAG) {
    return;
  }
  endDrag_();
}

/** Everything a drag leaves behind, whether or not it ended in a drop. */
function endDrag_() {
  DRAG = null;
  stopEdgeScroll_();
  el('ghost').classList.add('hidden');
  highlight_(null);
}

/** The drop target under these coordinates, or null. */
function dropTargetAt_(x, y) {
  var node = document.elementFromPoint(x, y);
  if (!node) {
    return null;
  }
  var seat = node.closest('[data-drop-kind="seat"]');
  if (seat) {
    return {
      kind: 'seat',
      node: seat,
      crew: parseInt(seat.dataset.crew, 10),
      seat: parseInt(seat.dataset.seat, 10),
    };
  }
  var land = node.closest('[data-drop-kind="land"]');
  if (land) {
    return { kind: 'land', node: land };
  }
  // The whole pool pane is the target, so a coach can aim at the empty space
  // below the names rather than at one of the rows.
  var pool = node.closest('#pool-panel');
  return pool ? { kind: 'pool', node: pool } : null;
}

function highlight_(target) {
  var previous = document.querySelector('.drop');
  if (previous) {
    previous.classList.remove('drop');
  }
  if (target) {
    target.node.classList.add('drop');
  }
}

/**
 * Every combination is a call into CrewsJs, and every one of them is a no-op
 * if it does not make sense. The status line says what happened, including
 * where a displaced rower went.
 */
function applyDrop_(drag, target) {
  var a = APP.assignment;

  if (target.kind === 'land') {
    var landed = null;
    if (drag.kind === 'pool') {
      landed = landFromPool_(a, drag.pool);
    } else if (drag.kind === 'seat') {
      landed = landFromSeat_(a, drag.crew, drag.seat);
    }
    if (landed) {
      setStatus(landed.name + ' is training on land.');
      render();
    }
    return;
  }

  if (drag.kind === 'land' && target.kind === 'pool') {
    var back = landToPool_(a, drag.land);
    if (back) {
      setStatus(back.name + ' off land and back in the pool.');
      render();
    }
    return;
  }

  if (drag.kind === 'land' && target.kind === 'seat') {
    var bumped = seatAt_(a, target.crew, target.seat);
    var fromLand = seatFromLand_(a, drag.land, target.crew, target.seat);
    if (!fromLand) {
      return;
    }
    var boat = a.crews[target.crew].boat;
    var said = fromLand.name + ' off land and into ' + boat.name + ' seat ' + (target.seat + 1);
    if (bumped) {
      said += ', ' + bumped.name + ' back to the pool';
    }
    if (!mayRow_(fromLand, boat)) {
      said += '. ' + fromLand.name + ' is below class ' + boat['class'] + ' - allowed, but marked';
    }
    setStatus(said + '.');
    render();
    return;
  }

  if (drag.kind === 'pool' && target.kind === 'seat') {
    var before = seatAt_(a, target.crew, target.seat);
    var seated = seatFromPool_(a, drag.pool, target.crew, target.seat);
    if (!seated) {
      return;
    }
    var crew = a.crews[target.crew];
    var message = seated.name + ' into ' + crew.boat.name + ' seat ' + (target.seat + 1);
    if (before) {
      message += ', ' + before.name + ' back to the pool';
    }
    if (!mayRow_(seated, crew.boat)) {
      // Marked, not undone: a coach has reasons the sheet does not know about.
      message += '. ' + seated.name + ' is ' + (seated.level || 'ungraded') +
        ' and ' + crew.boat.name + ' is class ' + crew.boat['class'] + ' - allowed, but marked.';
    }
    setStatus(message + '.');
    render();
    return;
  }

  if (drag.kind === 'seat' && target.kind === 'pool') {
    var moved = unseat_(a, drag.crew, drag.seat);
    if (!moved) {
      return;
    }
    setStatus(moved.name + ' out of seat ' + (drag.seat + 1) + ' and back in the pool.');
    render();
    return;
  }

  if (drag.kind === 'seat' && target.kind === 'seat') {
    var displaced = seatAt_(a, target.crew, target.seat);
    var swapped = moveBetweenSeats_(a, drag.crew, drag.seat, target.crew, target.seat);
    if (!swapped) {
      return;
    }
    var toCrew = a.crews[target.crew];
    var text = swapped.name + ' to ' + toCrew.boat.name + ' seat ' + (target.seat + 1);
    if (displaced) {
      text += ', swapped with ' + displaced.name;
    }
    var flags = [];
    if (!mayRow_(swapped, toCrew.boat)) {
      flags.push(swapped.name + ' is below class ' + toCrew.boat['class']);
    }
    if (displaced && !mayRow_(displaced, a.crews[drag.crew].boat)) {
      flags.push(displaced.name + ' is below class ' + a.crews[drag.crew].boat['class']);
    }
    setStatus(text + '.' + (flags.length ? ' ' + flags.join('; ') + ' - allowed, but marked.' : ''));
    render();
  }
}

// ------------------------------------------------------------------- start --

window.addEventListener('DOMContentLoaded', function () {
  el('session').onchange = function () {
    selectSession(parseInt(el('session').value, 10));
  };
  el('assign').onclick = doAssign;
  el('save').onclick = doSave;
  el('reload').onclick = load;
  el('tab-assignment').onclick = function () {
    showTab('assignment');
  };
  el('tab-groups').onclick = function () {
    showTab('groups');
  };
  el('tab-attendance').onclick = function () {
    showTab('attendance');
  };
  el('save-groups').onclick = doSaveGroups;
  el('load-attendance').onclick = loadAttendance;
  el('save-attendance').onclick = doSaveAttendance;
  el('attendance-filter').oninput = function () {
    APP.attendanceFilter = el('attendance-filter').value;
    renderAttendance();
  };
  el('copy-message').onclick = doCopyMessage;
  el('group-filter').oninput = function () {
    APP.groupFilter = el('group-filter').value;
    renderGroups();
  };

  document.addEventListener('pointerdown', onPointerDown);
  document.addEventListener('pointermove', onPointerMove);
  document.addEventListener('pointerup', onPointerUp);
  document.addEventListener('pointercancel', onPointerCancel);

  load();
});
</script>
